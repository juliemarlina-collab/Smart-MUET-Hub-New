<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart MUET Guide eBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@700;800&display=swap">
<style>
/* Layout: one-screen reader. Slim top bar, page stage in the middle, scrubber at the bottom, slide-in drawer for contents/pages/search/notes. Smart MUET Hub palette. */
:root{
  --bg:#f5f7ff; --chrome:#ffffff; --ink:#222635; --muted:#646878; --line:#dce0ef;
  --purple:#2f49d9; --purple-soft:#e7ecff; --yellow:#ffcc33; --orange:#ff754a; --teal:#1b8f6f; --pink:#e0479e;
  --stage:#e9ecf6; --shadow:0 18px 40px -18px #2a386b55; --hl:#ffcc3388;
  --display:Manrope,"Segoe UI",Arial,sans-serif; --body:"DM Sans",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161f; --chrome:#1d202c; --ink:#e6ebff; --muted:#a8adc2; --line:#333748;
  --purple:#90a7ff; --purple-soft:#282f48; --stage:#0e1016; --shadow:0 18px 40px -18px #000c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161f; --chrome:#1d202c; --ink:#e6ebff; --muted:#a8adc2; --line:#333748;
  --purple:#90a7ff; --purple-soft:#282f48; --stage:#0e1016; --shadow:0 18px 40px -18px #000c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--chrome)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.bar{display:flex;align-items:center;gap:6px;background:var(--chrome);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:30}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto;padding-left:4px}
.brand b{font:800 16px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;border-radius:12px;padding:0 10px;font-size:13px;font-weight:700}
.tb:hover{background:var(--purple-soft)}
.tb[aria-pressed="true"]{background:var(--purple);color:#fff}
.tb .lbl{display:none}
@media(min-width:1100px){.tb .lbl{display:inline}}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
@media(max-width:720px){.wide-only{display:none!important}}

/* stage */
.main{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;overflow:auto;background:var(--stage);position:relative;touch-action:pan-y pinch-zoom}
.spread{display:flex;justify-content:center;align-items:center;gap:0;min-height:100%;padding:18px;box-sizing:border-box;
  transform-origin:top center;perspective:2200px}
.page{position:relative;background:#fff;box-shadow:var(--shadow);aspect-ratio:595/842;flex:none;user-select:none;-webkit-user-select:none}
.spread.two .page:first-child{border-radius:6px 0 0 6px}
.spread.two .page:last-child{border-radius:0 6px 6px 0}
.spread.one .page{border-radius:6px}
.page img{width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none}
.page .hot{position:absolute;border-radius:4px;display:block;cursor:pointer}
.page .hot:hover{background:#2f49d91f;outline:2px solid #2f49d966}
.page .hl{position:absolute;background:var(--hl);mix-blend-mode:multiply;border-radius:2px;pointer-events:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.inking .page canvas{pointer-events:auto;cursor:crosshair}
.inking .page .hot{pointer-events:none}
.ribbon{position:absolute;top:-4px;right:22px;width:22px;height:40px;background:var(--orange);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);display:none}
.page.marked .ribbon{display:block}
.turn-next{animation:turnN .38s ease}
.turn-prev{animation:turnP .38s ease}
@keyframes turnN{from{transform:rotateY(-14deg) translateX(30px);opacity:.35}to{transform:none;opacity:1}}
@keyframes turnP{from{transform:rotateY(14deg) translateX(-30px);opacity:.35}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.turn-next,.turn-prev{animation:none}}
/* Heyzine-style page flip: a leaf turns on the spine, shaded, following the finger */
.page.ghost{visibility:hidden;box-shadow:none;background:none}
.flip-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:4;perspective:2600px}
.flip-cover{position:absolute;background:var(--stage);overflow:hidden}
.flip-cover img,.leaf-face img{width:100%;height:100%;display:block;object-fit:cover}
.leaf{position:absolute;transform-style:preserve-3d;will-change:transform}
.leaf-face{position:absolute;inset:0;background:#fff;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf-face.back{transform:rotateY(180deg)}
.leaf-face.paper{background:linear-gradient(90deg,#f1f2f8,#fff 30%)}
.leaf-shade{position:absolute;inset:0;opacity:0;pointer-events:none}
.leaf.hinge-l .front .leaf-shade{background:linear-gradient(90deg,#0000 0%,#0000002e 55%,#00000059 100%)}
.leaf.hinge-l .back .leaf-shade{background:linear-gradient(270deg,#0000 0%,#0000002e 55%,#00000059 100%)}
.leaf.hinge-r .front .leaf-shade{background:linear-gradient(270deg,#0000 0%,#0000002e 55%,#00000059 100%)}
.leaf.hinge-r .back .leaf-shade{background:linear-gradient(90deg,#0000 0%,#0000002e 55%,#00000059 100%)}
.flip-cast{position:absolute;pointer-events:none;opacity:0}
.spread.two .page+.page{box-shadow:var(--shadow),inset 14px 0 18px -14px #0003}
.spread.two .page:first-child:not(.ghost){box-shadow:var(--shadow),inset -14px 0 18px -14px #0003}

.nav{position:absolute;top:50%;translate:0 -50%;width:46px;height:46px;border-radius:50%;background:var(--chrome);box-shadow:0 4px 14px #0002;
  display:grid;place-items:center;z-index:5}
.nav.prev{left:max(10px,env(safe-area-inset-left,0px))}.nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.nav:disabled{opacity:.3;cursor:default}

/* drawer */
.drawer{position:absolute;inset:0 auto 0 0;width:min(360px,92vw);background:var(--chrome);border-right:1px solid var(--line);z-index:20;
  display:flex;flex-direction:column;translate:-102% 0;transition:translate .25s ease;box-shadow:12px 0 30px -20px #0006}
.drawer.open{translate:0 0}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--purple-soft);color:var(--purple)}
.panel{flex:1;overflow:auto;padding:12px 14px 24px}
.chap{margin-bottom:10px}
.chap>.ch{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 8px;border-radius:12px;font:800 15px/1.25 var(--display)}
.chap>.ch:hover,.sec:hover{background:var(--purple-soft)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px var(--display);flex:none}
.sec{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:7px 8px 7px 46px;border-radius:10px;font-size:14px}
.sec span:last-child,.chap small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.chap small{margin-left:auto}
.sec.cur,.chap>.ch.cur{background:var(--purple-soft);color:var(--purple)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.thumbs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs img{width:100%;aspect-ratio:595/842;border-radius:6px;border:2px solid transparent;box-shadow:0 2px 8px #0002;background:#fff}
.thumbs button.cur img{border-color:var(--purple)}
.field{display:flex;gap:6px;margin-bottom:12px}
.field input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit}
.result{display:block;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.result:hover{background:var(--purple-soft)}
.result b{display:block;font:800 13px var(--display);color:var(--purple);margin-bottom:2px}
.result mark{background:var(--hl);color:inherit;border-radius:2px}
.hint{color:var(--muted);font-size:13px}
.notehead{font:800 15px var(--display);margin:4px 0 8px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical;box-sizing:border-box}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.list button{display:flex;gap:10px;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.list button b{color:var(--purple);font-variant-numeric:tabular-nums;flex:none}
h3.sub{font:800 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px}
.main.pushed .stage{margin-left:min(360px,92vw)}.main.pushed .nav.prev{left:372px}
.scrim{position:absolute;inset:0;background:#0004;z-index:15}

/* ink palette */
.inkbar{position:absolute;left:50%;translate:-50% 0;top:12px;z-index:12;display:flex;gap:4px;background:var(--chrome);border:1px solid var(--line);
  border-radius:99px;padding:5px;box-shadow:0 8px 24px -10px #0005}
.inkbar button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.inkbar button[aria-pressed="true"]{background:var(--purple-soft);color:var(--purple)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003}

/* footer scrubber */
.foot{display:flex;align-items:center;gap:12px;background:var(--chrome);border-top:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot input[type=range]{flex:1;accent-color:var(--purple);min-width:0}
.count{font:700 13px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.goto{width:52px;height:34px;border:1px solid var(--line);border-radius:10px;text-align:center;background:var(--bg);color:var(--ink);font:700 13px var(--body)}
.toast{position:absolute;bottom:16px;left:50%;translate:-50% 0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
</style>
</head>
<body>

</svg>

<header class="bar">
  <button class="tb" id="bMenu" aria-label="Contents and pages" title="Contents (C)"><svg class="icon"><use href="#i-menu"/></svg><span class="lbl">Contents</span></button>
  <a class="tb" href="../index.html" aria-label="Back to Smart MUET Hub" title="Hub home"><svg class="icon"><use href="#i-left"/></svg><span class="lbl">Hub</span></a>
  <div class="brand"><b>Smart MUET Guide</b><span id="where">Band Up! 2027</span></div>
  <button class="tb" id="bSearch" aria-label="Search" title="Search (/)"><svg class="icon"><use href="#i-search"/></svg><span class="lbl">Search</span></button>
  <button class="tb" id="bMark" aria-label="Bookmark this page" aria-pressed="false" title="Bookmark (B)"><svg class="icon"><use href="#i-mark"/></svg><span class="lbl">Bookmark</span></button>
  <button class="tb" id="bInk" aria-label="Pen and highlighter" aria-pressed="false" title="Pen (P)"><svg class="icon"><use href="#i-pen"/></svg><span class="lbl">Pen</span></button>
  <button class="tb" id="bRead" aria-label="Read this page aloud" aria-pressed="false" title="Read aloud"><svg class="icon"><use href="#i-sound"/></svg><span class="lbl">Read aloud</span></button>
  <span class="sep wide-only"></span>
  <button class="tb wide-only" id="bOut" aria-label="Zoom out"><svg class="icon"><use href="#i-minus"/></svg></button>
  <button class="tb wide-only" id="bIn" aria-label="Zoom in"><svg class="icon"><use href="#i-plus"/></svg></button>
  <button class="tb wide-only" id="bSpread" aria-label="Show two pages" aria-pressed="true" title="Two-page view"><svg class="icon"><use href="#i-book"/></svg></button>
  <button class="tb wide-only" id="bFull" aria-label="Full screen"><svg class="icon"><use href="#i-full"/></svg></button>
  <button class="tb" id="bTheme" aria-label="Switch light or dark"><svg class="icon"><use href="#i-moon"/></svg></button>
</header>

<div class="main" id="main">
  <aside class="drawer" id="drawer" aria-label="Book navigation">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="toc" aria-selected="true">Contents</button>
      <button role="tab" data-tab="thumbs" aria-selected="false">Pages</button>
      <button role="tab" data-tab="search" aria-selected="false">Search</button>
      <button role="tab" data-tab="notes" aria-selected="false">My notes</button>
    </div>
    <div class="panel" id="pToc"></div>
    <div class="panel" id="pThumbs" hidden><div class="thumbs" id="thumbs"></div></div>
    <div class="panel" id="pSearch" hidden>
      <form class="field" id="sForm"><input id="sInput" type="search" placeholder="Try CLUE, band, PEEL…" aria-label="Search the book"><button class="tb" aria-label="Search"><svg class="icon"><use href="#i-search"/></svg></button></form>
      <div id="sResults"><p class="hint">Search every page of the guide. Matches are highlighted on the page.</p></div>
    </div>
    <div class="panel" id="pNotes" hidden>
      <p class="notehead" id="noteTitle">Note for page 1</p>
      <textarea id="noteText" placeholder="Type a note for this page. It stays on this device."></textarea>
      <h3 class="sub">Bookmarks</h3><div class="list" id="markList"></div>
      <h3 class="sub">Pages with notes</h3><div class="list" id="noteList"></div>
      <h3 class="sub">Pages with pen marks</h3><div class="list" id="inkList"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="inkbar" id="inkbar" hidden>
    <button data-tool="pen" aria-pressed="true" aria-label="Pen"><svg class="icon"><use href="#i-pen"/></svg></button>
    <button data-tool="hl" aria-pressed="false" aria-label="Highlighter"><svg class="icon"><use href="#i-hl"/></svg></button>
    <button data-tool="erase" aria-pressed="false" aria-label="Eraser"><svg class="icon"><use href="#i-erase"/></svg></button>
    <button data-color="#2f49d9" aria-label="Purple ink"><span class="dot" style="background:#2f49d9"></span></button>
    <button data-color="#e5373b" aria-label="Red ink"><span class="dot" style="background:#e5373b"></span></button>
    <button data-color="#1b8f6f" aria-label="Green ink"><span class="dot" style="background:#1b8f6f"></span></button>
    <button id="inkUndo" aria-label="Undo"><svg class="icon"><use href="#i-undo"/></svg></button>
    <button id="inkDone" aria-label="Close pen"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>

  <div class="stage" id="stage"><div class="spread" id="spread"></div></div>
  <button class="nav prev" id="prev" aria-label="Previous page"><svg class="icon"><use href="#i-left"/></svg></button>
  <button class="nav next" id="next" aria-label="Next page"><svg class="icon"><use href="#i-right"/></svg></button>
  <div class="toast" id="toast" role="status"></div>
</div>

<footer class="foot">
  <span class="count" id="count">1 / 53</span>
  <input type="range" id="scrub" min="1" max="53" value="1" aria-label="Page">
  <form id="gForm"><input class="goto" id="gInput" inputmode="numeric" aria-label="Go to page" placeholder="Go"></form>

ion. Aina · open and explain Shall we compare the options? I suggest campus clubs because students meet regularly around a shared interest. A photography club, for example, could plan an exhibition. Daniel · respond and compare That could work. Peer mentoring may be easier for a shy newcomer because one senior can introduce them to others. What do you think, Mei? Mei · evaluate a limitation I agree that mentoring offers support. However, one mentor may not share the same interests. A club gives students more people to connect with. Ravi · invite and develop Could sports help too? Team games encourage cooperation, although some students may not enjoy competition. Aina, how could clubs include everyone? Aina · address the concern Clubs could offer beginner sessions and let students try several activities. That would make joining less intimidating. Daniel · seek agreement So, shall we recommend beginner-friendly campus clubs, with peer mentors helping newcomers attend their first session? Mei and Ravi · conclude Yes. Clubs provide regular contact, and mentors make the first step easier. We agree on clubs supported by peer mentors. YOUR TURN Underline one invitation, one comparison and one response to another speaker. Then discuss a new topic without reading this model. · Contents Chapter 5: Reading · Smart MUET Guide · Band Up! 2027 30"},{"links":[{"b":[0.6508,0.7753,0.2036,0.0148],"p":32},{"b":[0.1815,0.8087,0.1265,0.0148],"p":32},{"b":[0.1815,0.8506,0.1385,0.0148],"p":34},{"b":[0.1815,0.8715,0.1679,0.0148],"p":35},{"b":[0.1815,0.8925,0.1234,0.0148],"p":36},{"b":[0.1815,0.9134,0.1274,0.0148],"p":37}],"words":[[0.0668,0.0517,0.0133,0.0146,"C"],[0.0852,0.0517,0.0133,0.0146,"H"],[0.1036,0.0517,0.0133,0.0146,"A"],[0.122,0.0517,0.0123,0.0146,"P"],[0.1393,0.0517,0.0113,0.0146,"T"],[0.1557,0.0517,0.0123,0.0146,"E"],[0.173,0.0517,0.0133,0.0146,"R"],[0.2016,0.0517,0.0103,0.0146,"5"],[0.0668,0.0916,0.1396,0.0451,"Read"],[0.2223,0.0916,0.0508,0.0451,"it."],[0.2889,0.0916,0.1587,     const a=document.createElement('a'); a.className='hot';
    Object.assign(a.style,{left:l.b[0]*100+'%',top:l.b[1]*100+'%',width:l.b[2]*100+'%',height:l.b[3]*100+'%'});

  return d;
}
function layout(){
  const sp=$('#spread'), st=$('#stage'), vis=visible(cur);
  const availH=st.clientHeight-36, availW=st.clientWidth-36-(innerWidth>600?100:0), cols=isTwo()?2:1;

  sp.querySelectorAll('.page').forEach(pg=>{pg.style.width=w*zoom+'px';pg.style.height=h*zoom+'px';const c=pg.querySelector('canvas');if(c)redrawInk(c)});
}
function render(dir){

  // preload neighbours

  const first=vis[0], last=vis[vis.length-1];

  try{localStorage.setItem('smh.pdfbook.v1.last',JSON.stringify(first));const rd=new Set(JSON.parse(localStorage.getItem('smh.pdfbook.v1.read')||'[]'));vis.forEach(v=>rd.add(v));localStorage.setItem('smh.pdfbook.v1.read',JSON.stringify([...rd]));localStorage.setItem('smh.flow.last',JSON.stringify({id:'book',label:'Book / eBook page '+first,path:'book/index.html#page='+first,date:new Date().toISOString()}))}catch(e){}

function go(p,dir){
  p=Math.max(1,Math.min(N,p|0)); const old=cur; cur=p;
  render(dir ?? (p>old?1:p<old?-1:0));
  $('#stage').scrollTo(0,0);
  if(innerWidth<900) closeDrawer();
}
function targetOf(d){ const vis=visible(cur); return d>0 ? vis[vis.length-1]+1 : (isTwo() && vis[0]>2 ? vis[0]-2 : vis[0]-1); }
function step(d){ flip(d); }

/* ---------- page flip (Heyzine style) ----------
   The real pages switch underneath; a "leaf" (front = page leaving, back = page arriving)
   turns on the spine with shading. Drag follows the finger; tap or arrows play it.
   Next pages are decoded first so the turn never stalls. */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let flipping=null;
const srcOf=p=>p?'pages/p'+pad(p)+'.webp':null;
function ready(ps){ return Promise.race([Promise.all(ps.map(p=>{const i=new Image();i.src=srcOf(p);return i.decode?i.decode().catch(()=>{}):Promise.resolve()})),new Promise(r=>setTimeout(r,500))]); }
function rectIn(el){ const st=$('#stage'),s=st.getBoundingClientRect(),r=el.getBoundingClientRect(); return {x:r.left-s.left+st.scrollLeft,y:r.top-s.top+st.scrollTop,w:r.width,h:r.height}; }
function slotsNow(){ const ch=[...$('#spread').children]; return ch.map(el=>({r:rectIn(el),p:el.dataset.p?+el.dataset.p:null})); }
function box(cls,r){ const d=document.createElement('div'); d.className=cls; Object.assign(d.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'}); return d; }
function faceOf(src,side){ const f=document.createElement('div'); f.className='leaf-face '+side+(src?'':' paper'); if(src){const i=new Image();i.src=src;i.alt='';f.append(i)} const sh=document.createElement('i'); sh.className='leaf-shade'; f.append(sh); return f; }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, easeOut=t=>1-Math.pow(1-t,3);

async function startFlip(d){
  if(flipping||zoom!==1||inking) return null;
  const t=targetOf(d); if(t<1||t>N) return null;
  flipping={pending:true};
  const two=isTwo(), oldCur=cur;
  await ready(visible(t));
  const before=slotsNow();
  cur=t; render(0);
  const after=slotsNow(), st=$('#stage');
  const layer=document.createElement('div'); layer.className='flip-layer';
  layer.style.width=st.scrollWidth+'px'; layer.style.height=st.scrollHeight+'px';
  let leaf, hinge, A0, A1, fadeOut=false, fadeIn=false;
  if(two){
    const [L0,R0]=before, [L1,R1]=after;
    if(d>0){ // right page turns over to the left
      layer.append(box('flip-cover',L0.r)); if(L0.p) layer.lastChild.append(Object.assign(new Image(),{src:srcOf(L0.p),alt:''}));
      leaf=box('leaf hinge-l',R0.r); leaf.append(faceOf(srcOf(R0.p),'front'),faceOf(srcOf(L1.p),'back'));
      hinge='left'; A0=0; A1=-180;
    } else { // left page turns over to the right
      layer.append(box('flip-cover',R0.r)); if(R0.p) layer.lastChild.append(Object.assign(new Image(),{src:srcOf(R0.p),alt:''}));
      leaf=box('leaf hinge-r',L0.r); leaf.append(faceOf(srcOf(L0.p),'front'),faceOf(srcOf(R1.p),'back'));
      hinge='right'; A0=0; A1=180;
    }
    layer.style.perspectiveOrigin=(R0.r.x)+'px 50%';
  } else {
    const [O]=before, [Nw]=after;
    if(d>0){ leaf=box('leaf hinge-l',O.r); leaf.append(faceOf(srcOf(O.p),'front'),faceOf(null,'back')); hinge='left'; A0=0; A1=-180; fadeOut=true; }
    else { layer.append(box('flip-cover',O.r)); layer.lastChild.append(Object.assign(new Image(),{src:srcOf(O.p),alt:''}));
      leaf=box('leaf hinge-l',Nw.r); leaf.append(faceOf(srcOf(Nw.p),'front'),faceOf(null,'back')); hinge='left'; A0=-180; A1=0; fadeIn=true; }
    layer.style.perspectiveOrigin=(O.r.x)+'px 50%';
  }
  leaf.style.transformOrigin=hinge+' center';
  layer.append(leaf); st.append(layer);
  const shades=leaf.querySelectorAll('.leaf-shade');
  let prog=0;
  const set=p=>{
    prog=Math.max(0,Math.min(1,p));
    const a=A0+(A1-A0)*prog, k=Math.sin(Math.PI*prog);
    leaf.style.transform='rotateY('+a+'deg)';
    leaf.style.boxShadow='0 '+(6+14*k)+'px '+(18+40*k)+'px rgba(10,20,60,'+(0.10+0.28*k)+')';
    shades.forEach(s=>s.style.opacity=(0.15+0.85*k).toFixed(3));
    leaf.style.opacity=fadeOut?(prog<.55?1:Math.max(0,1-(prog-.55)/.45)):fadeIn?(prog<.45?prog/.45:1):1;
  };
  set(0);
  let raf=0;
  const run=(to,ms,fn=ease)=>new Promise(res=>{
    cancelAnimationFrame(raf); const from=prog, t0=performance.now();
    if(reduceMotion) ms=1;
    const tick=now=>{ const k=Math.min(1,(now-t0)/ms); set(from+(to-from)*fn(k)); if(k<1) raf=requestAnimationFrame(tick); else res(); };
    raf=requestAnimationFrame(tick);
  });
  const finish=async(to,ms,fn)=>{ await run(to,ms,fn); layer.remove(); if(to===0){ cur=oldCur; render(0); } flipping=null; if(innerWidth<900) closeDrawer(); };
  flipping={set,finish,get prog(){return prog},w:(two?before[1].r.w:before[0].r.w)};
  return flipping;
}
async function flip(d){
  const t=targetOf(d); if(t<1||t>N) return;
  if(reduceMotion||zoom!==1||inking){ go(t,d); return; }
  if(flipping) return;
  const f=await startFlip(d); if(f) f.finish(1,700,ease);
}

/* drag to turn: the leaf follows the finger (or mouse), release to finish or fall back */
(()=>{
  const st=$('#stage'); let drag=null, suppressClick=false;
  st.addEventListener('pointerdown',e=>{
    if(inking||zoom!==1||flipping||e.button>0) return;
    if(e.target.closest('.nav,button')) return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,t:performance.now(),v:0,lx:e.clientX,lt:performance.now(),f:null,dir:0,started:false,up:false};
  });
  st.addEventListener('pointermove',async e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y, now=performance.now();
    drag.v=(e.clientX-drag.lx)/Math.max(1,now-drag.lt); drag.lx=e.clientX; drag.lt=now; drag.dx=dx;
    if(!drag.started){
      if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy)*1.2) { if(Math.abs(dy)>14) drag=null; return; }
      const dir=dx<0?1:-1, t=targetOf(dir); if(t<1||t>N){ drag=null; return; }
      drag.started=true; drag.dir=dir; suppressClick=true;
      try{ st.setPointerCapture(e.pointerId); }catch(_){}
      const me=drag; const f=await startFlip(dir); if(!f){ if(drag===me) drag=null; return; }
      me.f=f; if(me.up) release(me); else f.set(Math.abs(me.dx)/(f.w*1.15));
      return;
    }
    if(drag.f) drag.f.set(Math.max(0,-drag.dir*dx)/(drag.f.w*1.15));
  });
  function release(dg){
    const f=dg.f; if(!f) return;
    const p=f.prog, fast=(-dg.dir*dg.v)>0.45;
    if(p>0.28||fast) f.finish(1,Math.max(160,(1-p)*520),easeOut); else f.finish(0,Math.max(140,p*420),easeOut);
  }
  const end=e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const dg=drag; drag=null; dg.up=true;
    if(dg.started){ if(dg.f) release(dg); return; }
    // a tap on the outer edge of the book turns the page
    if(e.type==='pointerup'&&!e.target.closest('a,.hot')){
      const pages=[...$('#spread').querySelectorAll('.page:not(.ghost)')]; if(!pages.length) return;
      const r0=pages[0].getBoundingClientRect(), r1=pages[pages.length-1].getBoundingClientRect(), edge=Math.min(90,r1.width*.18);
      if(e.clientX>r1.right-edge&&e.clientX<=r1.right+20) flip(1);
      else if(e.clientX<r0.left+edge&&e.clientX>=r0.left-20) flip(-1);
    }
  };
  st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
  st.addEventListener('click',e=>{ if(suppressClick){ e.preventDefault(); e.stopPropagation(); suppressClick=false; } },true);
})();

/* ---------- drawer ---------- */
function openDrawer(tab){ $('#drawer').classList.add('open'); if(innerWidth<900) $('#scrim').hidden=false; if(innerWidth>=1200){$('#main').classList.add('pushed');layout()} showTab(tab); }

  $('#pToc').hidden=tab!=='toc'; $('#pThumbs').hidden=tab!=='thumbs'; $('#pSearch').hidden=tab!=='search'; $('#pNotes').hidden=tab!=='notes';

    ch.s.map(([t,p])=>`<button class="sec" data-goto="${p}"><span>${t}</span><span>${p}</span></button>`).join('')+'</div>').join('');
}

  if(!thumbsBuilt){ $('#thumbs').innerHTML=PAGES.map((_,i)=>`<button data-goto="${i+1}"><img loading="lazy" src="pages/t${pad(i+1)}.webp" alt="">${i+1}</button>`).join(''); thumbsBuilt=true; }

/* ---------- search ---------- */
const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function search(q){
  const terms=norm(q).split(' ').filter(Boolean); searchHits={};
  const box=$('#sResults');
  if(!terms.length){ box.innerHTML='<p class="hint">Type a word to search.</p>'; render(); return; }
  const out=[];
  PAGES.forEach((pg,i)=>{
    const words=pg.words.filter(w=>{const n=norm(w[4]); return terms.some(t=>n.startsWith(t)||(t.length>3&&n.includes(t)))});
    const text=norm(pg.text);
    if(words.length && terms.every(t=>text.includes(t))){
      searchHits[i+1]=words;
      const raw=pg.text, idx=raw.toLowerCase().indexOf(terms[0]);
      const s=Math.max(0,idx-50), snip=(s?'…':'')+raw.slice(s,idx+90)+'…';
      const esc=snip.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      const marked=esc.replace(new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>');
      out.push(`<button class="result" data-goto="${i+1}"><b>p. ${i+1} · ${label(i+1)}</b>${marked} <em class="hint">(${words.length})</em></button>`);
    }
  });
  box.innerHTML = out.length ? `<p class="hint">${out.length} page${out.length>1?'s':''} found.</p>`+out.join('') : '<p class="hint">No pages match. Try a shorter word.</p>';
  render();
}
$('#sForm').addEventListener('submit',e=>{e.preventDefault(); search($('#sInput').value)});

  $('#markList').innerHTML=marks.length?marks.slice().sort((a,b)=>a-b).map(row).join(''):'<p class="hint">Tap the bookmark button on any page.</p>';

  const ip=Object.keys(ink).filter(k=>ink[k]&&ink[k].length).map(Number).sort((a,b)=>a-b);

/* ---------- ink ---------- */
let inking=false;
function setupInk(cv,p){
  cv.dataset.p=p; let stroke=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  cv.addEventListener('pointerdown',e=>{
    if(!inking) return; e.preventDefault(); cv.setPointerCapture(e.pointerId);
    if(inkTool==='erase'){eraseAt(p,pt(e),cv);stroke={erase:true};return}
    stroke={t:inkTool,c:inkTool==='hl'?'#ffd400':inkColor,pts:[pt(e)]};
  });
  cv.addEventListener('pointermove',e=>{
    if(!stroke) return; e.preventDefault();
    if(stroke.erase){eraseAt(p,pt(e),cv);return}
    stroke.pts.push(pt(e)); redrawInk(cv,stroke);
  });
  const end=()=>{ if(stroke&&!stroke.erase&&stroke.pts.length>1){(ink[p]=ink[p]||[]).push(stroke);store.set('ink',ink)} stroke=null; redrawInk(cv); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
}
function eraseAt(p,[x,y],cv){
  const list=ink[p]; if(!list) return;
  const keep=list.filter(s=>!s.pts.some(([a,b])=>Math.hypot(a-x,(b-y)*1.41)<0.02));
  if(keep.length!==list.length){ink[p]=keep;store.set('ink',ink);redrawInk(cv)}
}
function redrawInk(cv,live){
  if(!cv) return; const p=cv.dataset.p, dpr=devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(!w) return;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  for(const s of [...(ink[p]||[]),...(live?[live]:[])]){
    g.beginPath(); g.lineCap='round'; g.lineJoin='round';
    g.strokeStyle=s.c; g.globalAlpha=s.t==='hl'?.35:1; g.lineWidth=s.t==='hl'?w*0.022:Math.max(2,w*0.004);
    s.pts.forEach(([x,y],i)=>i?g.lineTo(x*w,y*h):g.moveTo(x*w,y*h)); g.stroke();
  }
  g.globalAlpha=1;
}
function setInking(on){
  inking=on; $('#main').classList.toggle('inking',on); $('#inkbar').hidden=!on; $('#bInk').setAttribute('aria-pressed',on?'true':'false');
  if(on) toast('Draw on the page. Marks stay on this device.');
}
$('#inkbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tool){inkTool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}
  if(b.dataset.color){inkColor=b.dataset.color;if(inkTool!=='pen'){inkTool='pen';document.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tool==='pen'?'true':'false'))}}
  if(b.id==='inkUndo'){const vis=visible(cur);for(const p of vis.slice().reverse()){if(ink[p]&&ink[p].length){ink[p].pop();store.set('ink',ink);break}}document.querySelectorAll('.page canvas').forEach(c=>redrawInk(c))}
  if(b.id==='inkDone') setInking(false);
});

  document.documentElement.dataset.theme=dark?'light':'dark'; store.set('theme',document.documentElement.dataset.theme);
});
const th=store.get('theme',null); if(th) document.documentElement.dataset.theme=th;

addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();step(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
  else if(e.key==='Home') go(1); else if(e.key==='End') go(N);
  else if(e.key==='/'){e.preventDefault();openDrawer('search')}
  else if(e.key==='c'||e.key==='C') openDrawer('toc');
  else if(e.key==='b'||e.key==='B') toggleMark();
  else if(e.key==='p'||e.key==='P') setInking(!inking);
  else if(e.key==='Escape'){closeDrawer();setInking(false)}
});
addEventListener('resize',()=>{clearTimeout(layout.h);layout.h=setTimeout(()=>{if(!flipping)render()},120)});
addEventListener('hashchange',()=>{const m=location.hash.match(/^#(?:p|page=)(\d+)$/);if(m&&+m[1]!==visible(cur)[0])go(+m[1])});

buildToc();
const m=location.hash.match(/^#(?:p|page=)(\d+)$/);
cur = m ? +m[1] : store.get('last',1);
if(innerWidth>=1200) openDrawer('toc');
render();
</script>
